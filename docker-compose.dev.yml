services:

  mariadb:
    ports:
      - "3306:3306"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    ports:
      - "6379:6379"

  ollama:
    ports:
      - "11434:11434"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - upload_data:/app/data
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: >
      watchmedo auto-restart
        --directory=./app
        --pattern="*.py"
        --recursive
        -- celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 -Q ingest
    volumes:
      - ./backend:/app
      - upload_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

  nginx:
    profiles:
      - proxy

volumes:
  upload_data:
